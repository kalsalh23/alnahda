<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - مجموعة الابتكار والنهضة</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{--bg:#f6f5f0;--sidebar:#00211c;--card:#fff;--border:#e5e1d6;--text:#1f1f1f;--sub:#666;--gold:#b9a779}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Arabic',sans-serif}
    body{background:var(--bg);color:var(--text)}
    .login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f6f5f0,#e9e5dc)}
    .login-box{width:380px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 40px 80px -60px #000;overflow:hidden}
    .login-head{text-align:center;padding:36px 30px 16px}
    .login-head img{width:72px;height:72px;border-radius:50%;margin-bottom:12px}
    .login-head h1{font-family:'Noto Kufi Arabic',sans-serif;font-size:1.25rem}
    .login-head p{color:var(--sub);margin-top:4px}
    .login-form{display:flex;flex-direction:column;gap:14px;padding:10px 30px 36px}
    .login-form label{display:block;margin-bottom:6px;font-weight:500}
    .login-form input{width:100%;border:1px solid #d7d3c6;border-radius:10px;padding:10px 12px}
    .login-form button{background:#054239;color:#fff;border:none;border-radius:10px;padding:11px;cursor:pointer}
    .err{color:#d33;text-align:center;min-height:18px}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    .sidebar{background:var(--sidebar);color:#eae7e0;display:flex;flex-direction:column}
    .side-head{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid rgba(185,167,121,.3)}
    .side-head img{width:46px;height:46px;border-radius:50%}
    .side-head div strong{display:block;font-family:'Noto Kufi Arabic',sans-serif}
    .side-head div span{opacity:.7;font-size:.9rem}
    .nav{display:flex;flex-direction:column;gap:2px;padding:12px;flex:1}
    .nav button{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:#cfc9bd;text-align:right;padding:10px 12px;border-radius:8px;cursor:pointer}
    .nav button.active,.nav button:hover{background:rgba(185,167,121,.2);color:#fff}
    .side-foot{border-top:1px solid rgba(185,167,121,.3);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
    .side-foot a,.side-foot button{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:#cfc9bd;text-decoration:none;cursor:pointer}
    .main{display:flex;flex-direction:column}
    .top{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#fff;border-bottom:1px solid var(--border)}
    .top h1{font-family:'Noto Kufi Arabic',sans-serif;font-size:1.25rem}
    .top-right{display:flex;align-items:center;gap:14px}
    .save{background:#054239;color:#fff;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
    .wrap{padding:26px 28px;display:flex;flex-direction:column;gap:22px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:14px}
    .card i{font-size:1.6rem;color:var(--gold)}
    .card h2{font-size:1.8rem}
    .panel{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border)}
    .panel-head h2{font-family:'Noto Kufi Arabic',sans-serif}
    .panel-body{padding:22px;display:flex;flex-direction:column;gap:14px}
    .row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:14px 18px}
    .row-edit{display:none;flex-direction:column;gap:12px;padding:0 18px 18px}
    .row-edit.open{display:flex}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field input,.field textarea,.field select{border:1px solid #d7d3c6;border-radius:8px;padding:9px 12px}
    .field textarea{min-height:90px}
    .btns{display:flex;gap:8px}
    .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
    .btn.primary{background:#054239;color:#fff;border:none}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#001a16;color:#fff;padding:10px 24px;border-radius:999px;opacity:0;pointer-events:none}
    .toast.show{opacity:1}
    [data-view]{display:none}
    [data-view].active{display:flex;flex-direction:column;gap:22px}
  </style>
</head>
<body>
  <div class="login" id="login">
    <div class="login-box">
      <div class="login-head">
        <img src="../logo.jpg">
        <h1>مجموعة الابتكار والنهضة</h1>
        <p>لوحة التحكم</p>
      </div>
      <form class="login-form" id="loginForm">
        <div><label>البريد الإلكتروني</label><input id="email" value="alnahda27@gmail.com"></div>
        <div><label>كلمة المرور</label><input id="pass" type="password" value="reda@2027"></div>
        <button>دخول</button>
        <div class="err" id="err"></div>
      </form>
    </div>
  </div>

  <div class="app" id="app" style="display:none">
    <aside class="sidebar">
      <div class="side-head">
        <img src="../logo.jpg">
        <div><strong>مجموعة الابتكار والنهضة</strong><span>لوحة التحكم</span></div>
      </div>
      <nav class="nav">
        <button class="active" data-go="home"><i class="fas fa-chart-bar"></i> الرئيسية</button>
        <button data-go="projects"><i class="fas fa-th-large"></i> المشاريع</button>
        <button data-go="contact"><i class="fas fa-phone"></i> معلومات التواصل</button>
        <button data-go="vision"><i class="fas fa-bullseye"></i> الرؤية</button>
        <button data-go="about"><i class="fas fa-info-circle"></i> من نحن</button>
        <button data-go="hero"><i class="fas fa-home"></i> الصفحة الرئيسية</button>
      </nav>
      <div class="side-foot">
        <a href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> عرض الموقع</a>
        <button id="logout"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <h1 id="title">الرئيسية</h1>
        <div class="top-right">
          <span>alnahda27@gmail.com</span>
          <button class="save" id="save"><i class="fas fa-save"></i> حفظ التغييرات</button>
        </div>
      </header>
      <div class="wrap">
        <div data-view="home" class="active">
          <div class="cards">
            <div class="card"><i class="fas fa-th-large"></i><div><h2 id="pc">0</h2><p>عدد المشاريع</p></div></div>
            <div class="card"><i class="fas fa-check-circle"></i><div><h2>متصل</h2><p>حالة Supabase</p></div></div>
          </div>
        </div>

        <div data-view="projects">
          <div class="panel">
            <div class="panel-head"><h2>إدارة المشاريع</h2><button class="btn primary" id="addp"><i class="fas fa-plus"></i> إضافة مشروع</button></div>
            <div class="panel-body" id="plist"></div>
          </div>
        </div>

        <div data-view="contact">
          <div class="panel">
            <div class="panel-head"><h2>معلومات التواصل</h2></div>
            <div class="panel-body">
              <div class="grid">
                <div class="field"><label>البريد الإلكتروني</label><input id="ce"></div>
                <div class="field"><label>رقم الهاتف</label><input id="cp"></div>
              </div>
              <div class="grid">
                <div class="field"><label>العنوان بالعربية</label><input id="ca"></div>
                <div class="field"><label>العنوان بالإنجليزية</label><input id="cen"></div>
              </div>
            </div>
          </div>
        </div>

        <div data-view="vision">
          <div class="panel">
            <div class="panel-head"><h2>صفحة الرؤية</h2></div>
            <div class="panel-body">
              <div class="field"><label>المحتوى بالعربية</label><textarea id="va"></textarea></div>
              <div class="field"><label>المحتوى بالإنجليزية</label><textarea id="ve"></textarea></div>
            </div>
          </div>
        </div>

        <div data-view="about">
          <div class="panel">
            <div class="panel-head"><h2>صفحة من نحن</h2></div>
            <div class="panel-body">
              <div class="field"><label>المحتوى بالعربية</label><textarea id="aa"></textarea></div>
              <div class="field"><label>المحتوى بالإنجليزية</label><textarea id="ae"></textarea></div>
            </div>
          </div>
        </div>

        <div data-view="hero">
          <div class="panel">
            <div class="panel-head"><h2>الصفحة الرئيسية</h2></div>
            <div class="panel-body">
              <div class="grid">
                <div class="field"><label>العنوان الرئيسي بالعربية</label><input id="ha"></div>
                <div class="field"><label>العنوان الرئيسي بالإنجليزية</label><input id="he"></div>
              </div>
              <div class="grid">
                <div class="field"><label>النص الفرعي بالعربية</label><textarea id="hsa"></textarea></div>
                <div class="field"><label>النص الفرعي بالإنجليزية</label><textarea id="hse"></textarea></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/admin-final.js"></script>
</body>
</html>
